<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huffman Coding | Compression & Decompression</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@400;700;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>Huffman <span>Coding</span></h1>
            <p id="tagline">High Performance Compression</p>
        </header>

        <main>
            <div class="card">
                <div class="mode-toggle">
                    <button class="toggle-btn active" id="mode-compress">Compress</button>
                    <button class="toggle-btn" id="mode-decompress">Decompress</button>
                </div>

                <div class="upload-area" id="drop-zone">
                    <div class="upload-icon" id="upload-icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                    </div>
                    <h2 id="upload-title">Upload File</h2>
                    <p id="upload-subtitle">Select a .txt file to compress</p>
                    <input type="file" id="file-input" accept=".txt" hidden>
                    <button class="btn-primary" id="browse-btn">Choose File</button>
                </div>

                <div class="status-container hidden" id="status-container">
                    <div class="file-info">
                        <span class="filename" id="display-filename">sample.txt</span>
                        <span class="filesize" id="display-filesize">2.4 MB</span>
                    </div>

                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <p class="status-text" id="status-text">Ready to compress...</p>
                    </div>

                    <button class="btn-compress" id="compress-btn">Compress Now</button>
                </div>

                <div class="result-container hidden" id="result-container">
                    <div class="success-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                            <polyline points="22 4 12 14.01 9 11.01" />
                        </svg>
                    </div>
                    <h3 id="result-title">Success!</h3>
                    <p id="result-message">Compression completed successfully.</p>
                    <a href="#" class="btn-download" id="download-link">Download Binary (.bin)</a>
                    <button class="btn-secondary" id="reset-btn">Upload Another</button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 Huffman Coding Engine. All Rights Reserved.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
